<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="register-title">
        <p class="brand">Registration System</p>

        <h1 id="register-title">Create your account</h1>

        <p class="subtitle">Fill in your details to get started.</p>

        <form action="/register" method="POST" data-validate>
          <div class="field-group">
            <label for="name">Name</label>
            <input
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              required
              minlength="2"
            />
            <small
              class="field-error"
              id="name-error"
              aria-live="polite"
            ></small>
          </div>

          <div class="field-group">
            <label for="email">E-mail</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
            />
            <small
              class="field-error"
              id="email-error"
              aria-live="polite"
            ></small>
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <small
              class="field-error"
              id="password-error"
              aria-live="polite"
            ></small>
          </div>

          <button type="submit">Create account</button>
        </form>

        <p class="switch-page">
          Already have an account? <a href="/">Sign in</a>
        </p>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/form-validation.js') }}"></script>
  </body>
</html>
